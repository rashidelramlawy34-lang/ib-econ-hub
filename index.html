<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IB Econ Hub</title>
<style>
  :root {
    --bg: #f7f7fb;
    --panel: #ffffff;
    --panel-2: #f1f3f9;
    --text: #1a1a2e;
    --muted: #5b5f7a;
    --border: #e3e6ef;
    --primary: #4f46e5;
    --primary-2: #6366f1;
    --secondary: #0891b2;
    --hl: #9333ea;
    --good: #16a34a;
    --bad: #dc2626;
    --shadow: 0 1px 3px rgba(20,20,40,.06), 0 4px 14px rgba(20,20,40,.06);
    --radius: 14px;
  }
  body.dark {
    --bg: #0e0f1a;
    --panel: #161827;
    --panel-2: #1e2133;
    --text: #e8e9f3;
    --muted: #9aa0bd;
    --border: #2a2d44;
    --primary: #818cf8;
    --primary-2: #a5b4fc;
    --secondary: #22d3ee;
    --hl: #c084fc;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
  }
  a { color: var(--primary); text-decoration: none; }
  button {
    font-family: inherit; cursor: pointer; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); border-radius: 10px; padding: 8px 14px;
    transition: all .15s;
  }
  button:hover { border-color: var(--primary); }
  button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  button.primary:hover { background: var(--primary-2); border-color: var(--primary-2); }
  input, select, textarea {
    font-family: inherit; font-size: 14px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    outline: none; transition: border-color .15s;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); }

  /* Layout */
  .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  .sidebar {
    background: var(--panel); border-right: 1px solid var(--border);
    padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; }
  .brand-logo {
    width: 36px; height: 36px; border-radius: 9px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px;
  }
  .brand-title { font-weight: 700; letter-spacing: .2px; }
  .brand-sub { font-size: 11px; color: var(--muted); }

  .toggles { display: flex; flex-direction: column; gap: 8px; padding: 0 6px 14px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .switch {
    position: relative; width: 42px; height: 24px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 999px; cursor: pointer; transition: background .15s;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
    background: var(--primary); border-radius: 50%; transition: left .15s, background .15s;
  }
  .switch.on { background: rgba(79,70,229,.18); }
  .switch.on::after { left: 20px; }
  .level-pill {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 700;
    background: rgba(79,70,229,.12); color: var(--primary);
  }
  .level-pill.hl { background: rgba(147,51,234,.12); color: var(--hl); }

  .nav { list-style: none; padding: 0; margin: 0; }
  .nav li { }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px;
    color: var(--text); font-size: 14px; cursor: pointer; user-select: none;
    border: 1px solid transparent;
  }
  .nav-item:hover { background: var(--panel-2); }
  .nav-item.active { background: rgba(79,70,229,.10); color: var(--primary); border-color: rgba(79,70,229,.18); font-weight: 600; }
  .nav-icon { width: 18px; display: inline-grid; place-items: center; }
  .nav-sub { padding-left: 28px; }
  .nav-sub .nav-item { padding: 6px 10px; font-size: 13px; color: var(--muted); }
  .nav-sub .nav-item.active { color: var(--primary); background: transparent; border-color: transparent; }

  .main { padding: 32px 40px 80px; max-width: 1100px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  h2 { font-size: 20px; margin: 28px 0 10px; }
  h3 { font-size: 16px; margin: 22px 0 8px; color: var(--text); }
  .page-sub { color: var(--muted); margin-bottom: 24px; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow);
  }
  .grid { display: grid; gap: 16px; }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; }
    .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; }
    .main { padding: 24px 18px 60px; }
  }

  /* Hide HL content when SL mode */
  body.sl-mode .hl-only { display: none !important; }

  .badge {
    display: inline-block; font-size: 10.5px; padding: 2px 7px; border-radius: 999px;
    font-weight: 700; letter-spacing: .3px; vertical-align: middle;
  }
  .badge.hl { background: rgba(147,51,234,.15); color: var(--hl); }
  .badge.sl { background: rgba(8,145,178,.15); color: var(--secondary); }
  .badge.unit { background: var(--panel-2); color: var(--muted); }

  /* Study notes */
  .note-section { margin-bottom: 22px; }
  .key-concept {
    background: linear-gradient(135deg, rgba(79,70,229,.08), rgba(8,145,178,.06));
    border-left: 4px solid var(--primary);
    padding: 14px 16px; border-radius: 8px; margin: 14px 0;
  }
  .key-concept .label {
    font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: .8px;
  }
  .hl-section {
    background: linear-gradient(135deg, rgba(147,51,234,.06), rgba(147,51,234,.02));
    border-left: 4px solid var(--hl);
    padding: 14px 16px; border-radius: 8px; margin: 14px 0;
  }

  /* Flashcards */
  .flash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .flashcard { perspective: 1000px; height: 200px; }
  .flashcard-inner {
    position: relative; width: 100%; height: 100%; transition: transform .55s;
    transform-style: preserve-3d; cursor: pointer;
  }
  .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
  .flashcard-face {
    position: absolute; inset: 0; backface-visibility: hidden; padding: 16px;
    border-radius: var(--radius); border: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow);
  }
  .flashcard-back { transform: rotateY(180deg); background: var(--panel-2); }
  .flashcard-term { font-weight: 700; font-size: 16px; }
  .flashcard-def { font-size: 13.5px; overflow-y: auto; }
  .flashcard-eg { font-size: 12px; color: var(--muted); margin-top: 8px; font-style: italic; }
  .flashcard-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .learned-btn { font-size: 11px; padding: 4px 8px; border-radius: 999px; }
  .learned-btn.on { background: var(--good); color: #fff; border-color: var(--good); }
  .progress { background: var(--panel-2); height: 8px; border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
  .progress-bar { background: linear-gradient(90deg, var(--primary), var(--secondary)); height: 100%; width: 0%; transition: width .35s; }

  /* Practice */
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .tab { padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .qbox { padding: 16px; border-bottom: 1px solid var(--border); }
  .qbox:last-child { border-bottom: none; }
  .qhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .qmeta { display: flex; gap: 6px; flex-wrap: wrap; }
  .reveal { margin-top: 10px; padding: 12px 14px; background: var(--panel-2); border-radius: 10px; display: none; }
  .reveal.show { display: block; }
  .mc-options { display: grid; gap: 8px; margin: 10px 0; }
  .mc-option {
    text-align: left; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel); cursor: pointer;
  }
  .mc-option:hover { border-color: var(--primary); }
  .mc-option.correct { background: rgba(22,163,74,.10); border-color: var(--good); color: var(--text); }
  .mc-option.wrong { background: rgba(220,38,38,.10); border-color: var(--bad); color: var(--text); }

  /* Calculator */
  .calc-card { padding: 16px; }
  .calc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; align-items: center; }
  .calc-result { margin-top: 12px; padding: 12px; background: var(--panel-2); border-radius: 10px; font-size: 14px; }
  .calc-result strong { color: var(--primary); font-size: 18px; }

  /* Tutor */
  .chat { display: flex; flex-direction: column; height: 70vh; min-height: 480px; }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 14px; background: var(--panel-2); border-radius: 12px; margin-bottom: 12px; }
  .msg { padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; max-width: 85%; white-space: pre-wrap; }
  .msg.user { background: var(--primary); color: #fff; margin-left: auto; }
  .msg.assistant { background: var(--panel); border: 1px solid var(--border); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { font-size: 12px; padding: 6px 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); cursor: pointer; }
  .chip:hover { border-color: var(--primary); color: var(--primary); }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row textarea { resize: none; height: 60px; }

  /* Diagrams (SVG) */
  .svg-diagram {
    background: var(--panel-2); border-radius: 12px; padding: 16px;
    margin: 14px 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .econ-svg { max-width: 100%; height: auto; color: var(--text); }
  .svg-caption { font-size: 12.5px; color: var(--muted); text-align: center; }

  ul.tight { margin: 6px 0 12px; padding-left: 22px; }
  ul.tight li { margin-bottom: 4px; }
  .stat {
    display: flex; flex-direction: column; gap: 2px;
  }
  .stat-num { font-size: 26px; font-weight: 700; color: var(--primary); }
  .stat-lbl { font-size: 12px; color: var(--muted); }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters select, .filters input { width: auto; min-width: 160px; }
  .pill-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 14px; }
  .pill {
    padding: 6px 12px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border);
    font-size: 13px; cursor: pointer; user-select: none;
  }
  .pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  details { background: var(--panel-2); border-radius: 10px; padding: 10px 14px; margin: 8px 0; }
  details summary { cursor: pointer; font-weight: 600; }
  details[open] summary { margin-bottom: 8px; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 22px 0; }
  table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
</style>
</head>
<body class="">

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">IE</div>
      <div>
        <div class="brand-title">IB Econ Hub</div>
        <div class="brand-sub">Study smarter</div>
      </div>
    </div>

    <div class="toggles">
      <div class="toggle-row">
        <span>Level <span id="level-pill" class="level-pill">SL</span></span>
        <div id="level-switch" class="switch" title="Toggle SL/HL"></div>
      </div>
      <div class="toggle-row">
        <span>Dark mode</span>
        <div id="dark-switch" class="switch" title="Toggle dark mode"></div>
      </div>
    </div>

    <ul class="nav" id="nav">
      <li><div class="nav-item active" data-page="dashboard"><span class="nav-icon">◉</span> Dashboard</div></li>
      <li>
        <div class="nav-item" data-page="notes"><span class="nav-icon">≡</span> Study Notes</div>
        <div class="nav-sub" id="notes-sub">
          <div class="nav-item" data-page="notes" data-unit="1">Unit 1 — Intro</div>
          <div class="nav-item" data-page="notes" data-unit="2">Unit 2 — Micro</div>
          <div class="nav-item" data-page="notes" data-unit="3">Unit 3 — Macro</div>
          <div class="nav-item" data-page="notes" data-unit="4">Unit 4 — International</div>
          <div class="nav-item" data-page="notes" data-unit="5">Unit 5 — Development</div>
        </div>
      </li>
      <li><div class="nav-item" data-page="definitions"><span class="nav-icon">▤</span> Definitions</div></li>
      <li><div class="nav-item" data-page="practice"><span class="nav-icon">✎</span> Practice</div></li>
      <li><div class="nav-item" data-page="calculator"><span class="nav-icon">∑</span> Calculator</div></li>
      <li><div class="nav-item" data-page="exams"><span class="nav-icon">⎚</span> Exam Papers</div></li>
      <li><div class="nav-item" data-page="tutor"><span class="nav-icon">✦</span> AI Tutor</div></li>
    </ul>
  </aside>

  <!-- Main -->
  <main class="main" id="main"></main>
</div>

<script>
// ============================================================
// DATA
// ============================================================

const UNITS = {
  1: "Intro to Economics",
  2: "Microeconomics",
  3: "Macroeconomics",
  4: "International Economics",
  5: "Development Economics"
};

// --- DEFINITIONS ---
const DEFINITIONS = [
  // Unit 1
  {term:"Scarcity", def:"The fundamental economic problem: unlimited wants but limited resources.", eg:"Oil reserves are finite while global demand keeps rising.", unit:1, level:"SL"},
  {term:"Opportunity cost", def:"The value of the next-best alternative forgone when making a choice.", eg:"Choosing university means forgoing the salary from full-time work.", unit:1, level:"SL"},
  {term:"Production possibilities curve (PPC)", def:"A model showing the maximum combinations of two goods that can be produced with a given set of resources.", eg:"Points inside the PPC indicate unemployment of resources.", unit:1, level:"SL"},
  {term:"Positive economics", def:"Statements based on facts and evidence that can be tested.", eg:"\"An increase in tax raises government revenue.\"", unit:1, level:"SL"},
  {term:"Normative economics", def:"Statements based on value judgments about what should be.", eg:"\"The government should reduce inequality.\"", unit:1, level:"SL"},
  {term:"Free market economy", def:"An economy where resources are allocated by the price mechanism without government intervention.", eg:"Hong Kong is often cited as close to a free market.", unit:1, level:"SL"},
  {term:"Command economy", def:"An economy where resources are allocated by central planning.", eg:"The former Soviet Union used central planning.", unit:1, level:"SL"},
  {term:"Mixed economy", def:"An economy combining market and government allocation.", eg:"Most modern economies (UK, France) are mixed.", unit:1, level:"SL"},
  {term:"Factors of production", def:"Resources used to produce goods and services: land, labour, capital, entrepreneurship.", eg:"A factory uses land, workers, machinery, and management.", unit:1, level:"SL"},
  {term:"Ceteris paribus", def:"Latin for \"all other things being equal\" — used to isolate variables.", eg:"As price falls, quantity demanded rises, ceteris paribus.", unit:1, level:"SL"},

  // Unit 2 — Micro SL
  {term:"Demand", def:"The quantity of a good consumers are willing and able to buy at each price over a period of time.", eg:"At $5 a coffee, 100 cups are demanded daily.", unit:2, level:"SL"},
  {term:"Supply", def:"The quantity of a good producers are willing and able to sell at each price over a period of time.", eg:"At $5 a coffee, 100 cups are supplied daily.", unit:2, level:"SL"},
  {term:"Equilibrium", def:"The price and quantity at which quantity demanded equals quantity supplied.", eg:"At $4, Qd = Qs = 80 units — the market clears.", unit:2, level:"SL"},
  {term:"Consumer surplus", def:"The difference between what consumers are willing to pay and what they actually pay.", eg:"Willing to pay $10, paid $7 → $3 consumer surplus.", unit:2, level:"SL"},
  {term:"Producer surplus", def:"The difference between the price producers receive and the minimum they were willing to accept.", eg:"Sold at $7, willing to accept $4 → $3 producer surplus.", unit:2, level:"SL"},
  {term:"Allocative efficiency", def:"Achieved when resources are allocated to produce goods most desired by society — MSB = MSC.", eg:"Free competitive markets allocate resources allocatively efficiently absent failures.", unit:2, level:"SL"},
  {term:"Price elasticity of demand (PED)", def:"The responsiveness of quantity demanded to a change in price: %ΔQd / %ΔP.", eg:"PED of −2 means a 10% price rise reduces demand by 20%.", unit:2, level:"SL"},
  {term:"Price elasticity of supply (PES)", def:"The responsiveness of quantity supplied to a change in price: %ΔQs / %ΔP.", eg:"PES of 0.5: a 10% price rise increases supply by 5%.", unit:2, level:"SL"},
  {term:"Income elasticity of demand (YED)", def:"%ΔQd / %ΔY. Distinguishes normal (+) from inferior (−) goods.", eg:"YED of 1.5 → a luxury good (income elastic).", unit:2, level:"SL"},
  {term:"Cross elasticity of demand (XED)", def:"%ΔQd of A / %ΔP of B. Positive = substitutes; negative = complements.", eg:"Tea & coffee XED > 0 (substitutes).", unit:2, level:"SL"},
  {term:"Market failure", def:"When the free market fails to allocate resources efficiently.", eg:"Pollution from factories not priced into output.", unit:2, level:"SL"},
  {term:"Negative externality of production", def:"A cost imposed on third parties from production activity not reflected in price.", eg:"Air pollution from steel production.", unit:2, level:"SL"},
  {term:"Positive externality of consumption", def:"A benefit to third parties from consumption not reflected in price.", eg:"Vaccinations reduce disease spread for everyone.", unit:2, level:"SL"},
  {term:"Public good", def:"A good that is non-rivalrous and non-excludable.", eg:"National defence, street lighting.", unit:2, level:"SL"},
  {term:"Merit good", def:"A good underprovided by the market and under-consumed because individuals undervalue benefits.", eg:"Education, healthcare.", unit:2, level:"SL"},
  {term:"Demerit good", def:"A good overprovided by the market and over-consumed because individuals undervalue costs.", eg:"Cigarettes, alcohol.", unit:2, level:"SL"},
  {term:"Price ceiling", def:"A maximum price set by the government below market equilibrium.", eg:"Rent controls in New York City.", unit:2, level:"SL"},
  {term:"Price floor", def:"A minimum price set by the government above market equilibrium.", eg:"Minimum wage; agricultural price supports.", unit:2, level:"SL"},
  {term:"Indirect tax", def:"A tax on expenditure (e.g., VAT, excise) collected by sellers and passed on in the price.", eg:"VAT on consumer goods.", unit:2, level:"SL"},
  {term:"Subsidy", def:"A payment from the government to producers to lower costs and increase supply.", eg:"Renewable energy subsidies.", unit:2, level:"SL"},
  {term:"Asymmetric information", def:"When one party in a transaction has more or better information than the other.", eg:"Used-car sellers know more about defects than buyers.", unit:2, level:"SL"},

  // Unit 2 — Micro HL
  {term:"Marginal revenue (MR)", def:"The additional revenue from selling one more unit.", eg:"MR=0 marks the profit-maximising point under MC=MR for a monopolist.", unit:2, level:"HL"},
  {term:"Marginal cost (MC)", def:"The additional cost of producing one more unit.", eg:"Firms produce where MR=MC to maximise profit.", unit:2, level:"HL"},
  {term:"Perfect competition", def:"A market with many small firms, identical products, free entry/exit, perfect information; firms are price takers.", eg:"Wheat farming approximates perfect competition.", unit:2, level:"HL"},
  {term:"Monopoly", def:"A market with a single firm controlling supply, with high barriers to entry.", eg:"Many local utilities are natural monopolies.", unit:2, level:"HL"},
  {term:"Monopolistic competition", def:"Many firms selling differentiated products with low barriers to entry.", eg:"Restaurants, hairdressers.", unit:2, level:"HL"},
  {term:"Oligopoly", def:"A market dominated by a few large interdependent firms.", eg:"Global smartphone market.", unit:2, level:"HL"},
  {term:"Game theory", def:"Studies strategic interactions where each player's outcome depends on others' choices.", eg:"Prisoner's dilemma — both confess due to lack of trust.", unit:2, level:"HL"},
  {term:"Price discrimination", def:"Charging different prices to different consumers for the same good when not justified by cost.", eg:"Student/senior cinema discounts.", unit:2, level:"HL"},
  {term:"Economies of scale", def:"Falling long-run average costs as output rises.", eg:"Larger firms negotiate cheaper bulk inputs.", unit:2, level:"HL"},

  // Unit 3 — Macro SL
  {term:"GDP", def:"The total monetary value of all final goods and services produced within a country in a year.", eg:"US GDP 2022 ≈ $25 trillion.", unit:3, level:"SL"},
  {term:"GNI", def:"GDP plus net income earned by domestic residents abroad.", eg:"Ireland's GNI < GDP due to large MNC profits flowing out.", unit:3, level:"SL"},
  {term:"Aggregate demand (AD)", def:"Total spending on an economy's output: AD = C + I + G + (X − M).", eg:"AD shifts right when consumer confidence rises.", unit:3, level:"SL"},
  {term:"Aggregate supply (AS)", def:"Total output firms in an economy plan to supply at each price level.", eg:"SRAS shifts left when oil prices rise.", unit:3, level:"SL"},
  {term:"Business cycle", def:"Short-term fluctuations of real GDP around long-term trend: boom, recession, trough, recovery.", eg:"2008–09 global recession.", unit:3, level:"SL"},
  {term:"Cyclical unemployment", def:"Unemployment caused by a fall in AD during a downturn.", eg:"Mass layoffs during 2009 recession.", unit:3, level:"SL"},
  {term:"Structural unemployment", def:"Unemployment caused by a mismatch between worker skills and available jobs.", eg:"Coal miners losing jobs as economies decarbonise.", unit:3, level:"SL"},
  {term:"Frictional unemployment", def:"Short-term unemployment as people move between jobs.", eg:"A graduate searching for their first role.", unit:3, level:"SL"},
  {term:"Demand-pull inflation", def:"A sustained rise in price level caused by rising AD.", eg:"Booming economy bidding up prices.", unit:3, level:"SL"},
  {term:"Cost-push inflation", def:"A sustained rise in price level caused by rising costs of production.", eg:"2022 inflation spike from energy & food costs.", unit:3, level:"SL"},
  {term:"CPI", def:"Consumer price index — measures inflation by tracking a weighted basket of household goods.", eg:"CPI rose 6% YoY in 2022 in many economies.", unit:3, level:"SL"},
  {term:"Fiscal policy", def:"Government use of taxation and spending to influence AD.", eg:"Tax cuts to stimulate growth.", unit:3, level:"SL"},
  {term:"Monetary policy", def:"Central bank use of interest rates and money supply to influence AD.", eg:"Fed raising rates to fight inflation.", unit:3, level:"SL"},
  {term:"Supply-side policies", def:"Policies that increase potential output — both market-based (deregulation) and interventionist (education).", eg:"Investing in worker training.", unit:3, level:"SL"},

  // Unit 3 — Macro HL

  {q:"Define <em>opportunity cost</em>.", marks:2, unit:1, level:"SL", a:"The value of the next-best alternative forgone when a choice is made."},
  {q:"Explain, using a diagram, how a positive consumption externality leads to market failure.", marks:4, unit:2, level:"SL", a:"At the free-market equilibrium, MPB = MPC, but MSB > MPB. The socially optimal output Q* (where MSB = MSC) exceeds Qm. Diagram shows MSB above MPB; underconsumption between Qm and Q* generates a welfare loss (triangle between MSB and MSC). A subsidy or government provision can correct it."},

// --- CALCULATORS metadata used to render the calculator page ---
const CALCS = [
  {id:"ped", name:"Price Elasticity of Demand (PED)",
    inputs:[{k:"p1",l:"Old price",ph:"e.g. 10"},{k:"p2",l:"New price",ph:"e.g. 12"},{k:"q1",l:"Old quantity",ph:"e.g. 100"},{k:"q2",l:"New quantity",ph:"e.g. 80"}],
    fn: v => {
      const dQ = ((v.q2 - v.q1) / v.q1) * 100;
      const dP = ((v.p2 - v.p1) / v.p1) * 100;
      const ped = dQ / dP;
      const tag = Math.abs(ped) > 1 ? "Elastic" : Math.abs(ped) === 1 ? "Unit elastic" : Math.abs(ped) === 0 ? "Perfectly inelastic" : "Inelastic";
      return {value: ped.toFixed(3), label: "PED", note: `${tag}. %ΔQ = ${dQ.toFixed(2)}%, %ΔP = ${dP.toFixed(2)}%.`};
    }
  },
  {id:"pes", name:"Price Elasticity of Supply (PES)",
    inputs:[{k:"p1",l:"Old price"},{k:"p2",l:"New price"},{k:"q1",l:"Old quantity"},{k:"q2",l:"New quantity"}],
    fn: v => {
      const dQ = ((v.q2 - v.q1) / v.q1) * 100;
      const dP = ((v.p2 - v.p1) / v.p1) * 100;
      const pes = dQ / dP;
      const tag = pes > 1 ? "Elastic" : pes === 1 ? "Unit elastic" : "Inelastic";
      return {value: pes.toFixed(3), label: "PES", note: `${tag}. %ΔQ = ${dQ.toFixed(2)}%, %ΔP = ${dP.toFixed(2)}%.`};
    }
  },
  {id:"yed", name:"Income Elasticity of Demand (YED)",
    inputs:[{k:"y1",l:"Old income"},{k:"y2",l:"New income"},{k:"q1",l:"Old quantity"},{k:"q2",l:"New quantity"}],
    fn: v => {
      const dQ = ((v.q2 - v.q1) / v.q1) * 100;
      const dY = ((v.y2 - v.y1) / v.y1) * 100;
      const yed = dQ / dY;
      const tag = yed < 0 ? "Inferior good" : yed > 1 ? "Luxury (income elastic normal)" : "Necessity (income inelastic normal)";
      return {value: yed.toFixed(3), label: "YED", note: tag};
    }
  },
  {id:"xed", name:"Cross Elasticity of Demand (XED)",
    inputs:[{k:"pb1",l:"Good B old price"},{k:"pb2",l:"Good B new price"},{k:"qa1",l:"Good A old qty"},{k:"qa2",l:"Good A new qty"}],
    fn: v => {
      const dQ = ((v.qa2 - v.qa1) / v.qa1) * 100;
      const dP = ((v.pb2 - v.pb1) / v.pb1) * 100;
      const xed = dQ / dP;
      const tag = xed > 0 ? "Substitutes" : xed < 0 ? "Complements" : "Unrelated";
      return {value: xed.toFixed(3), label: "XED", note: tag};
    }
  },
  {id:"gdp", name:"GDP — Expenditure approach",
    inputs:[{k:"c",l:"Consumption (C)"},{k:"i",l:"Investment (I)"},{k:"g",l:"Government (G)"},{k:"x",l:"Exports (X)"},{k:"m",l:"Imports (M)"}],
    fn: v => {
      const gdp = v.c + v.i + v.g + (v.x - v.m);
      return {value: gdp.toLocaleString(), label: "GDP", note: `C+I+G+(X−M) = ${v.c}+${v.i}+${v.g}+(${v.x}−${v.m})`};
    }
  },
  {id:"unemp", name:"Unemployment rate",
    inputs:[{k:"un",l:"Unemployed"},{k:"lf",l:"Labour force"}],
    fn: v => {
      const r = (v.un / v.lf) * 100;
      return {value: r.toFixed(2) + "%", label: "Unemployment rate", note: `${v.un} / ${v.lf} × 100`};
    }
  },
  {id:"infl", name:"CPI Inflation rate",
    inputs:[{k:"c1",l:"CPI period 1"},{k:"c2",l:"CPI period 2"}],
    fn: v => {
      const r = ((v.c2 - v.c1) / v.c1) * 100;
      return {value: r.toFixed(2) + "%", label: "Inflation", note: `(${v.c2}−${v.c1})/${v.c1} × 100`};
    }
  },
  {id:"real", name:"Real GDP from Nominal",
    inputs:[{k:"nom",l:"Nominal GDP"},{k:"px",l:"Price index"}],
    fn: v => {
      const real = (v.nom / v.px) * 100;
      return {value: real.toLocaleString(), label: "Real GDP", note: `(Nominal / Price index) × 100`};
    }
  },
  {id:"mult", name:"Keynesian Multiplier (HL)", level:"HL",
    inputs:[{k:"mpc",l:"MPC (0–1)"}],
    fn: v => {
      const k = 1 / (1 - v.mpc);
      return {value: k.toFixed(3), label: "Multiplier (k)", note: `k = 1 / (1 − MPC). With MPC=${v.mpc}.`};
    }
  },
  {id:"tot", name:"Terms of Trade (HL)", level:"HL",
    inputs:[{k:"px",l:"Export price index"},{k:"pm",l:"Import price index"}],
    fn: v => {
      const tot = (v.px / v.pm) * 100;
      return {value: tot.toFixed(2), label: "ToT", note: `(Px / Pm) × 100. >100 means improvement.`};
    }
  },
  {id:"fx", name:"Exchange Rate Converter",
    inputs:[{k:"amt",l:"Amount"},{k:"rate",l:"Exchange rate (target/source)"}],
    fn: v => {
      const out = v.amt * v.rate;
      return {value: out.toLocaleString(), label: "Converted", note: `${v.amt} × ${v.rate}`};
    }
  },
];

function setPage(page, opts = {}) {
  state.page = page;
  if (opts.unit) state.notesUnit = parseInt(opts.unit, 10);
  document.querySelectorAll(".nav-item").forEach(el => {
    const isMatch = el.dataset.page === page && (!el.dataset.unit || parseInt(el.dataset.unit) === state.notesUnit);
    el.classList.toggle("active", page === el.dataset.page && (!el.dataset.unit ? !opts.unit : isMatch));
  });
  // exception: top-level "notes" should remain active when on notes
  document.querySelectorAll('.nav-item[data-page="notes"]').forEach(el => {
    if (!el.dataset.unit && page === "notes") el.classList.add("active");
  });
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function render() {
  const main = document.getElementById("main");
  switch (state.page) {
    case "dashboard": main.innerHTML = renderDashboard(); break;
    case "notes": main.innerHTML = renderNotes(); break;

    case "practice": main.innerHTML = renderPractice(); attachPractice(); break;

    case "exams": main.innerHTML = renderExams(); break;
    case "tutor": main.innerHTML = renderTutor(); attachTutor(); break;

}

function attachDefinitions() {
  const unitFilter = document.getElementById("def-unit-filter");
  const levelFilter = document.getElementById("def-level-filter");
  const search = document.getElementById("def-search");
  const grid = document.getElementById("flash-grid");

  function refresh() {
    const u = unitFilter.value;
    const l = levelFilter.value;
    const q = search.value.trim().toLowerCase();
    const slMode = state.level === "SL";
    const items = DEFINITIONS.filter(d => {
      if (slMode && d.level === "HL") return false;
      if (u !== "all" && d.unit != u) return false;
      if (l !== "all" && d.level !== l) return false;
      if (q && !(d.term.toLowerCase().includes(q) || d.def.toLowerCase().includes(q))) return false;
      return true;
    });
    grid.innerHTML = items.map((d, idx) => {
      const id = `def-${DEFINITIONS.indexOf(d)}`;
      const learned = state.learned.includes(id);
      return `
        <div class="flashcard" data-id="${id}">
          <div class="flashcard-inner">
            <div class="flashcard-face">
              <div>
                <div class="qmeta" style="margin-bottom:8px;">
                  <span class="badge unit">Unit ${d.unit}</span>
                  <span class="badge ${d.level === 'HL' ? 'hl' : 'sl'}">${d.level}</span>
                </div>
                <div class="flashcard-term">${d.term}</div>
              </div>
              <div class="flashcard-foot">
                <span style="font-size:11px;color:var(--muted)">Click to flip</span>
                <button class="learned-btn ${learned ? 'on' : ''}" data-action="learn" data-id="${id}">${learned ? '✓ Learned' : 'Mark learned'}</button>
              </div>
            </div>
            <div class="flashcard-face flashcard-back">
              <div>
                <div class="flashcard-def">${d.def}</div>
                <div class="flashcard-eg">e.g., ${d.eg}</div>
              </div>
              <div class="flashcard-foot">
                <span style="font-size:11px;color:var(--muted)">Click to flip back</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join("") || `<p style="color:var(--muted)">No matching terms.</p>`;
  }
  refresh();

  grid.addEventListener("click", e => {
    const learnBtn = e.target.closest('[data-action="learn"]');
    if (learnBtn) {
      e.stopPropagation();
      const id = learnBtn.dataset.id;
      if (state.learned.includes(id)) {
        state.learned = state.learned.filter(x => x !== id);
      } else {
        state.learned.push(id);
      }
      localStorage.setItem("learned", JSON.stringify(state.learned));
      refresh();
      // also update the bar
      const total = DEFINITIONS.length;
      const pct = Math.round((state.learned.length / total) * 100);
      document.querySelector(".progress-bar").style.width = pct + "%";
      return;
    }
    const card = e.target.closest(".flashcard");
    if (card) card.classList.toggle("flipped");
  });
  unitFilter.addEventListener("change", refresh);
  levelFilter.addEventListener("change", refresh);
  search.addEventListener("input", refresh);
}

function attachPracticeBody() {
  if (state.practiceTab === "short") {
    document.querySelectorAll("[data-toggle]").forEach(b => {
      b.addEventListener("click", () => {
        const id = b.dataset.toggle;
        document.getElementById("reveal-"+id).classList.toggle("show");
        // mark as reviewed once
        const key = "short-"+id;
        if (!state.shortAnswered.includes(key)) {
          state.shortAnswered.push(key);
          localStorage.setItem("shortAnswered", JSON.stringify(state.shortAnswered));
        }
      });
    });
    const filter = document.getElementById("sq-unit-filter");
    filter.addEventListener("change", () => {
      const v = filter.value;
      document.querySelectorAll("#sq-list .qbox").forEach(box => {
        box.style.display = (v === "all" || box.dataset.unit === v) ? "" : "none";
      });
    });
  } else if (state.practiceTab === "calc") {
    document.querySelectorAll("[data-toggle-calc]").forEach(b => {
      b.addEventListener("click", () => {
        document.getElementById("reveal-calc-"+b.dataset.toggleCalc).classList.toggle("show");
      });
    });
  } else {
    let sessionAnswered = 0, sessionCorrect = 0;
    document.querySelectorAll(".mc-option").forEach(opt => {
      opt.addEventListener("click", () => {
        const i = parseInt(opt.dataset.i, 10);
        const j = parseInt(opt.dataset.j, 10);
        const slMode = state.level === "SL";
        const list = MCQS.filter(q => !(slMode && q.level === "HL"));
        const m = list[i];
        const wrap = document.querySelector(`[data-mcq="${i}"]`);
        if (wrap.dataset.locked === "1") return;
        wrap.dataset.locked = "1";
        const correct = j === m.correct;
        wrap.querySelectorAll(".mc-option").forEach((b, k) => {
          if (k === m.correct) b.classList.add("correct");
          else if (k === j && !correct) b.classList.add("wrong");
          b.disabled = true;
        });
        const reveal = document.getElementById("mcq-reveal-"+i);
        reveal.innerHTML = (correct ? "<strong style='color:var(--good)'>Correct.</strong> " : "<strong style='color:var(--bad)'>Incorrect.</strong> ") + m.explain;
        reveal.classList.add("show");
        sessionAnswered++;
        if (correct) sessionCorrect++;
        state.mcqStats.answered++;
        if (correct) state.mcqStats.correct++;
        localStorage.setItem("mcqStats", JSON.stringify(state.mcqStats));
        document.getElementById("mcq-score").textContent = sessionCorrect + "/" + sessionAnswered;
        document.getElementById("mcq-acc").textContent = Math.round((sessionCorrect/sessionAnswered)*100) + "%";
      });
    });
    document.getElementById("mcq-reset").addEventListener("click", () => {
      state.mcqStats = {answered:0, correct:0};
      localStorage.setItem("mcqStats", JSON.stringify(state.mcqStats));
      renderPracticeBody();
    });
  }
}

function attachCalculator() {
  document.querySelectorAll("[data-run]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.run;
      const calc = CALCS.find(c => c.id === id);
      const card = document.querySelector(`[data-calc="${id}"]`);
      const v = {};
      let ok = true;
      card.querySelectorAll("input").forEach(inp => {
        const num = parseFloat(inp.value);
        if (isNaN(num)) ok = false;
        v[inp.dataset.k] = num;
      });
      const out = document.getElementById("calc-out-"+id);
      if (!ok) {
        out.style.display = "block";
        out.innerHTML = "<span style='color:var(--bad)'>Please fill all fields with valid numbers.</span>";
        return;
      }
      try {
        const r = calc.fn(v);
        out.style.display = "block";
        out.innerHTML = `<div>${r.label}: <strong>${r.value}</strong></div><div style="font-size:12px;color:var(--muted);margin-top:6px">${r.note}</div>`;
      } catch (e) {
        out.style.display = "block";
        out.innerHTML = "<span style='color:var(--bad)'>Calculation error. Check inputs.</span>";
      }
    });
  });
}

      <table>
        <tr><th>Term</th><th>What it requires</th></tr>
        <tr><td>Define</td><td>Give a precise meaning.</td></tr>
        <tr><td>Describe</td><td>Give a detailed account.</td></tr>
        <tr><td>Distinguish</td><td>Make clear the differences between two/more concepts.</td></tr>
        <tr><td>Draw</td><td>Produce a labelled diagram (axes, curves, equilibria).</td></tr>
        <tr><td>Explain</td><td>Give a detailed account with reasons or causes.</td></tr>
        <tr><td>Analyse</td><td>Break down into components and identify essential features.</td></tr>
        <tr><td>Apply</td><td>Use a concept/theory in a particular context.</td></tr>
        <tr><td>Calculate</td><td>Show working and arrive at a numerical answer.</td></tr>
        <tr><td>Compare</td><td>Give similarities between two/more items.</td></tr>
        <tr><td>Compare and contrast</td><td>Similarities AND differences.</td></tr>
        <tr><td>Construct</td><td>Build / create (often a diagram or argument).</td></tr>
        <tr><td>Derive</td><td>Manipulate to reach a result, showing the steps.</td></tr>
        <tr><td>Design</td><td>Produce a plan, diagram, or model.</td></tr>
        <tr><td>Determine</td><td>Reach a conclusion using reasoning or calculation.</td></tr>
        <tr><td>Discuss</td><td>Balanced review with arguments for and against.</td></tr>
        <tr><td>Evaluate</td><td>Assess strengths and weaknesses; reach a judgment.</td></tr>
        <tr><td>Examine</td><td>Consider an argument in detail; uncover assumptions.</td></tr>
        <tr><td>Formulate</td><td>Express precisely and systematically.</td></tr>
        <tr><td>Predict</td><td>Give an expected result.</td></tr>
        <tr><td>Recommend</td><td>Suggest an action with justification.</td></tr>
        <tr><td>Suggest</td><td>Propose, with reasoning, but without commitment.</td></tr>
        <tr><td>To what extent</td><td>Assess how far a claim is true; nuanced judgment.</td></tr>
      </table>
    </div>
  `;
}

function renderTutor() {
  if (!state.apiKey) {
    return `
      <h1>AI Tutor</h1>
      <p class="page-sub">Personalised IB Economics help powered by Claude. Your API key is stored locally — it never leaves your browser.</p>
      <div class="card" style="max-width:600px">
        <h3 style="margin-top:0">Set up</h3>
        <p style="font-size:14px;color:var(--muted)">Get an Anthropic API key from <a href="https://console.anthropic.com/" target="_blank" rel="noopener">console.anthropic.com</a>.</p>
        <input id="api-key-input" placeholder="sk-ant-..." />
        <button class="primary" id="save-key" style="margin-top:10px">Save key</button>
        <p style="font-size:12px;color:var(--muted);margin-top:14px">The key is saved in <code>localStorage</code> and only sent directly to Anthropic from your browser.</p>
      </div>
    `;
  }
  return `
    <h1>AI Tutor</h1>
    <p class="page-sub">Ask anything. The tutor answers in IB exam style with diagrams (described), command-term awareness, and mark schemes.</p>
    <div class="chips">
      <span class="chip" data-prompt="Explain the diagram for a positive consumption externality.">Explain a diagram</span>
      <span class="chip" data-prompt="Give me a paper 1 part (b) question on monopoly and a model 15-mark answer.">Past-paper question</span>
      <span class="chip" data-prompt="What is the difference between SL and HL content for market structures?">SL vs HL difference</span>
      <span class="chip" data-prompt="I'll paste my answer — please mark it against IB criteria and tell me what's missing.">Check my answer</span>
      <span class="chip" data-prompt="Quick recap: Marshall–Lerner condition and J-curve, with a diagram description.">Marshall–Lerner & J-curve</span>
    </div>
    <div class="chat">
      <div class="chat-msgs" id="chat-msgs">
        ${state.chatHistory.length === 0 ? '<div style="color:var(--muted);text-align:center;padding-top:40px">Start a conversation. Ask any IB Economics question.</div>' : ""}
        ${state.chatHistory.map(m => `<div class="msg ${m.role}">${escapeHTML(m.content)}</div>`).join("")}
      </div>
      <div class="chat-input-row">
        <textarea id="chat-input" placeholder="Ask a question... (Shift+Enter = newline)"></textarea>
        <button class="primary" id="chat-send">Send</button>
      </div>
      <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
        <button id="chat-clear">Clear chat</button>
        <button id="chat-changekey">Change API key</button>
        <span style="font-size:12px;color:var(--muted)">Model: claude-opus-4-7</span>
      </div>
    </div>
  `;
}

function escapeHTML(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function attachTutor() {
  if (!state.apiKey) {
    document.getElementById("save-key").addEventListener("click", () => {
      const v = document.getElementById("api-key-input").value.trim();
      if (!v) return;
      state.apiKey = v;
      localStorage.setItem("anthropic_api_key", v);
      render();
    });
    return;
  }
  const input = document.getElementById("chat-input");
  const sendBtn = document.getElementById("chat-send");
  const msgsEl = document.getElementById("chat-msgs");

  document.querySelectorAll(".chip").forEach(c => {
    c.addEventListener("click", () => {
      input.value = c.dataset.prompt;
      input.focus();
    });
  });

  document.getElementById("chat-clear").addEventListener("click", () => {
    state.chatHistory = [];
    render();
  });
  document.getElementById("chat-changekey").addEventListener("click", () => {
    localStorage.removeItem("anthropic_api_key");
    state.apiKey = "";
    state.chatHistory = [];
    render();
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener("click", sendMessage);

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    state.chatHistory.push({role:"user", content:text});
    appendMsg("user", text);
    const placeholder = appendMsg("assistant", "Thinking...");

    try {
      const systemPrompt = `You are an expert IB Economics tutor. Tailor your answers to IB exam style:
- Use IB command terms (define, explain, analyse, evaluate, discuss, to what extent) appropriately.
- When relevant, describe diagrams in clear text (axes, curves, equilibria, shifts, areas of welfare loss).
- Reference both SL and HL content where appropriate. The current student is studying ${state.level}; emphasise ${state.level} content.
- For evaluative questions, give balanced arguments and reach a justified judgment.
- For mark-scheme style answers, indicate where marks are awarded.
- Use real-world examples (named country/firm/year).
- Keep answers focused and well-structured (use short paragraphs, occasional bullet lists).`;
      const messages = state.chatHistory.map(m => ({role: m.role, content: m.content}));
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": state.apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-opus-4-7",
          max_tokens: 1500,
          system: systemPrompt,
          messages
        })
      });
      if (!res.ok) {
        const err = await res.text();
        placeholder.textContent = "Error: " + err.slice(0, 400);
        return;
      }
      const data = await res.json();
      const reply = (data.content || []).map(c => c.text || "").join("\n").trim() || "(no reply)";
      placeholder.textContent = reply;
      state.chatHistory.push({role:"assistant", content: reply});
    } catch (err) {
      placeholder.textContent = "Network error: " + err.message;
    }
  }

  function appendMsg(role, text) {
    const empty = msgsEl.querySelector("div[style*='text-align:center']");
    if (empty) empty.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    msgsEl.appendChild(div);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return div;
  }
}

// ============================================================
// INIT
// ============================================================
document.getElementById("nav").addEventListener("click", e => {
  const item = e.target.closest(".nav-item");
  if (!item) return;
  const page = item.dataset.page;
  if (!page) return;
  const opts = {};
  if (item.dataset.unit) opts.unit = item.dataset.unit;
  setPage(page, opts);
});
document.getElementById("level-switch").addEventListener("click", () => {
  state.level = state.level === "SL" ? "HL" : "SL";
  applyLevel();
  render();
});
document.getElementById("dark-switch").addEventListener("click", () => {
  state.dark = !state.dark;
  applyDark();
});

applyLevel();
applyDark();
render();
</script>
</body>
</html>
